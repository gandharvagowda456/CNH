extent.reporter.spark.start=true
extent.reporter.json.start=true
extent.reporter.pdf.start=true
extent.reporter.spark.config=src/test/resources/extent-config.xml

extent.reporter.spark.out=build/test-output/Spark/ExtentSpark.html
extent.reporter.json.out=build/test-output/Json/ExtentJson.json
extent.reporter.pdf.out=build/test-output/PdfReport/ExtentPdf.pdf

#test,dashboard,category,exception,author,device,log
extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log

#embed image as base64 string src default is false
extent.reporter.spark.base64imagesrc=false

screenshot.dir=build/test-output/Spark
screenshot.rel.path=./

systeminfo.os=Mac
systeminfo.version=8.1

#this is optional and creates the report in base folder name with date time format
#basefolder.name=CucumberExtent-Reports
#basefolder.datetimepattern=d-MMM-YY HH-mm-ss