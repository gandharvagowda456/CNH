buildscript {
    repositories {
        jcenter()
    }
    dependencies {
        classpath "net.masterthought:cucumber-reporting:5.3.0"
    }
}
plugins {
    id 'java'
    id 'maven-publish'
    id "io.freefair.lombok" version "8.4"
}


repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {

    implementation 'io.cucumber:cucumber-java:6.10.4'
    testImplementation 'io.cucumber:cucumber-testng:6.10.4'
    implementation 'org.seleniumhq.selenium:selenium-java:3.141.59'
    implementation 'io.github.bonigarcia:webdrivermanager:5.9.2'
    implementation 'org.awaitility:awaitility:3.0.0'
    implementation 'net.masterthought:cucumber-reporting:5.3.0'
    implementation group: 'com.codoid.products', name: 'fillo', version: '1.21'
    implementation group: 'org.apache.pdfbox', name: 'pdfbox', version: '2.0.25'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testImplementation 'tech.grasshopper:extentreports-cucumber6-adapter:2.8.4'
    implementation 'com.aventstack:extentreports:5.0.9'
    testImplementation 'io.cucumber:cucumber-junit:6.10.4'
    testImplementation 'io.cucumber:cucumber-core:6.10.4'
    testImplementation 'io.cucumber:cucumber-picocontainer:6.10.4'
    //testImplementation 'junit:junit:4.12',
    implementation 'io.rest-assured:rest-assured:5.3.0'
    implementation 'io.rest-assured:json-path:5.3.0'
    implementation 'io.rest-assured:xml-path:5.3.0'
    implementation 'org.hamcrest:hamcrest-all:1.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.1'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv:2.13.4'
    implementation 'org.apache.logging.log4j:log4j-core:2.22.0'
    implementation 'org.json:json:20231013'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.1'
    implementation 'com.jayway.jsonpath:json-path:2.8.0'


}

group = 'CNH'
version = '1.0-SNAPSHOT'
description = 'CNH'
java.sourceCompatibility = JavaVersion.VERSION_1_8

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}
task cucumber() {
    dependsOn assemble, compileTestJava
    doLast {
        javaexec {
            systemProperty('envcu', System.properties['envcu'] ?: 'stg')
            main = "io.cucumber.core.cli.Main"
            classpath = sourceSets.test.runtimeClasspath
            args = ['--plugin', 'pretty','--plugin','html:CucumberReport/report.html','--plugin', 'json:CucumberReport/report.json','--glue', 'stepdefs', 'src/test/features']
        }

    }
}

test {
    File reportOutputDirectory = new File("test-output")
    reportOutputDirectory.deleteDir()
    useTestNG()
    systemProperties(System.properties)
    scanForTestClasses = false
    testLogging.showStandardStreams = true
}






task generateReport() {
    doLast {
        println("Test completed")
//        generateReport()
    }
}


test.finalizedBy generateReport
